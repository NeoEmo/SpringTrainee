spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: 12345
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true # вывод SQL-запросов
    hibernate:
      ddl-auto: update
  output:
    ansi:
      enabled: always # цветной вывод логотипа
  application:
    name: SpringTrainee
  devtools:
    add-properties: false

logging:
  pattern:
    dateformat: "yyyy-MM-dd HH:mm:ss" # кастомный формат даты в логах

app:
  welcome-message: "Welcome to Spring blog!" # наше кастомное сообщение

user:
  full-name: "Ivan Ivanov"
  age: 25

config:
  users:
    names:
      - "Alice"
      - "Bob"
server:
  error:
    include-stacktrace: never
    include-message: always