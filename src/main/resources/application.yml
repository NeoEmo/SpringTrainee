server:
  port: ${PORT:8080}
spring:
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true # вывод SQL-запросов
    hibernate:
      ddl-auto: update
  output:
    ansi:
      enabled: always # цветной вывод логотипа
  application:
    name: SpringTrainee
  devtools:
    add-properties: false

logging:
  pattern:
    dateformat: "yyyy-MM-dd HH:mm:ss" # кастомный формат даты в логах

app:
  welcome-message: "Welcome to Spring blog!" # наше кастомное сообщение

user:
  full-name: "Ivan Ivanov"
  age: 25

config:
  users:
    names:
      - "Alice"
      - "Bob"
rsa:
  private-key: classpath:certs/private.pem
  public-key: classpath:certs/public.pem